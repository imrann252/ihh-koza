server.port=8080

# Şifre İstemeyen Hafif Gömülü H2 Veritabanı Ayarları
spring.datasource.url=jdbc:h2:mem:ihh_koza_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL Şema Yapılandırması (schema.sql dosyasını otomatik tetikler)
spring.sql.init.mode=always
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Konsolu Aktif Etme (Verileri tarayıcıdan izlemek için)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Log Seviyesi
logging.level.org.springframework=INFO
